<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wallet News Demo</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallet">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>

:root{
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --jp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  --bg:#0B0B0D; --card:#17171A; --card2:#232327; --fill:rgba(255,255,255,.08); --line:rgba(255,255,255,.1);
  --t1:#F4F5F7; --t2:#A0A5AE; --t3:#6A6F79;
  --acc:#3D7EFF; --acc-soft:rgba(61,126,255,.17); --on-acc:#fff;
  --up:#2FC46D; --dn:#F2474F;
  --bar:rgba(20,20,23,.82); --sk1:#19191D; --sk2:#25252B;
  --sb-up:#2AAE5E; --sb-fl:#707580; --sb-dn:#EC4A50; --imp:#F5C451; --imp-bg:rgba(245,196,81,.16);
  --outer1:#17171c; --outer2:#070708; --cap:#939399; --ctl:rgba(255,255,255,.08); --ctl-on:#2B2B31;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F3F6; --card:#FFFFFF; --card2:#E8EAEE; --fill:rgba(16,22,34,.055); --line:rgba(16,22,34,.1);
  --t1:#0D1015; --t2:#5C6470; --t3:#949BA6;
  --acc:#2F6FEB; --acc-soft:rgba(47,111,235,.11);
  --up:#119F53; --dn:#E0313B;
  --bar:rgba(250,250,252,.86); --sk1:#E3E5E9; --sk2:#EEF0F3;
  --sb-up:#119F53; --sb-fl:#858C97; --sb-dn:#E0313B; --imp:#8F5E00; --imp-bg:rgba(245,181,0,.22);
  --outer1:#F5F6F9; --outer2:#D8DBE1; --cap:#6A6F78; --ctl:rgba(0,0,0,.06); --ctl-on:#fff;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--outer2);color:var(--t1);font-family:var(--sf);-webkit-font-smoothing:antialiased;height:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
h1,p{margin:0}
#main{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 25%,var(--outer1),var(--outer2) 65%);container-type:size}


.m-preview{height:100%;min-height:0;padding:12px 14px 16px;display:flex;align-items:center;flex-direction:column}
.m-preview-caption{height:26px;margin-bottom:8px;display:flex;align-items:center;gap:16px;color:var(--cap);font:12px/1.4 var(--jp);letter-spacing:.08em;white-space:nowrap}
.m-ctrl{display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.m-seg{display:flex;padding:2px;border-radius:8px;background:var(--ctl)}
.m-seg button,.m-btn{height:22px;padding:0 10px;border-radius:6px;font:12px/22px var(--jp);color:var(--cap)}
.m-seg button.on{background:var(--ctl-on);color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.m-btn{background:var(--ctl)}
.m-seg button:hover,.m-btn:hover{color:var(--t1)}
@media (max-width:480px){.m-preview-caption>span:first-child{display:none}}
.m-phone{--h:min(calc(100cqh - 62px),calc((100cqw - 42px)*2.11314));position:relative;height:var(--h);width:calc(var(--h)*.47323);padding:calc(var(--h)*.0111);flex:none;border:1px solid #62616b;border-radius:calc(var(--h)*.0676);background:linear-gradient(135deg,#55545d,#17171c 19%,#393840 55%,#101014 84%,#5a5962);box-shadow:0 28px 80px rgba(0,0,0,.55),inset 0 0 0 2px #1b1b20,inset 0 0 0 5px #08080a}
.m-side{position:absolute;width:4px;background:#77757f;border-radius:3px 0 0 3px;left:-4px}.m-side-silent{top:15%;height:3.5%}.m-side-volume{top:22%;height:9%}.m-side-power{left:auto;right:-4px;top:24%;height:10%;border-radius:0 3px 3px 0}
.m-phone-screen{position:relative;width:100%;height:100%;overflow:hidden;background:#000;border-radius:calc(var(--h)*.063);isolation:isolate;-webkit-user-select:none;user-select:none}
.cv{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0;overflow:hidden;background:#000;color:var(--t1);font-size:16px;line-height:1.3;letter-spacing:-.2px}
html.shot #main{background:#000}
html.shot .m-preview{display:block;padding:0}
html.shot .m-preview-caption,html.shot .m-side{display:none}
html.shot .m-phone{width:393px;height:852px;padding:0;border:0;border-radius:0;background:#000;box-shadow:none}
html.shot .m-phone-screen{border-radius:0}
html.shot *{transition:none!important;animation:none!important}

html.phone{touch-action:manipulation;overscroll-behavior:none}
html.phone body{background:#000}
html.phone #main{background:#000}
html.phone .m-preview{display:block;padding:0}
html.phone .m-preview-caption,html.phone .m-side{display:none}
html.phone .m-phone{width:100%;height:100%;padding:0;border:0;border-radius:0;background:#000;box-shadow:none}
html.phone .m-phone-screen{border-radius:0}
html.phone .st-clock,html.phone .st-ic,html.phone .island,html.phone .homeind{display:none}
html.phone .cmp-row input{font-size:16px}                                          
html.phone .w-acct{-webkit-touch-callout:none}

.dmenu{position:absolute;inset:0;z-index:130;background:rgba(0,0,0,.42)}
.dm-card{position:absolute;left:16px;right:16px;top:104px;padding:16px;border-radius:18px;background:var(--card);color:var(--t1);display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.dm-card b{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--t2)}
.dm-seg{display:flex;padding:3px;border-radius:12px;background:var(--fill)}
.dm-seg button{flex:1;height:38px;border-radius:9px;font-size:15px;font-weight:600;color:var(--t2)}
.dm-seg button.on{background:var(--card2);color:var(--t1)}
.dm-btn{height:46px;border-radius:12px;background:var(--acc);color:var(--on-acc);font-size:15.5px;font-weight:600;text-align:center}


.layer{position:absolute;inset:0;overflow:hidden;background:var(--bg);transform-origin:50% 0}
.panel{position:absolute;inset:0;background:var(--bg)}
.panel.off{visibility:hidden}
.scroller{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.pg{position:relative;min-height:100%}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30}
.status{position:absolute;left:0;right:0;top:0;height:54px;z-index:100;pointer-events:none;color:var(--t1);transition:color .25s}
.cv.presented:not(.webopen) .status,.cv.locked .status{color:#fff}
.st-clock{position:absolute;left:20px;width:81px;top:19px;height:20px;line-height:20px;text-align:center;font-size:17px;font-weight:600;letter-spacing:-.3px;transition:opacity .2s}
.cv.locked .st-clock{opacity:0}
.st-ic{position:absolute;left:295px;top:22px;height:13px;display:flex;align-items:center;gap:5px}
.island{position:absolute;left:134px;top:11px;width:125px;height:37px;border-radius:19px;background:#000;z-index:101;pointer-events:none}
.homeind{position:absolute;left:129.5px;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--t1);z-index:102;pointer-events:none;transition:background-color .25s}
.cv.locked .homeind{background:#fff}

.tnav{position:absolute;left:0;right:0;top:0;height:98px;z-index:5;pointer-events:none}
.tnav>*{pointer-events:auto}
.tnav-bg{position:absolute;inset:0;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:0 .5px 0 var(--line);opacity:0;transition:opacity .2s;pointer-events:none!important}
.tnav-t{position:absolute;left:80px;right:80px;top:54px;height:44px;line-height:44px;text-align:center;font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none!important}
.panel.sc .tnav-bg,.panel.sc .tnav-t{opacity:1}
.lt{padding:98px 20px 0;height:146px;font-size:34px;font-weight:700;line-height:41px;letter-spacing:.3px}

.tbar{position:absolute;left:0;right:0;bottom:0;height:83px;z-index:6;display:flex;padding:0 8px 34px;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);box-shadow:0 -.5px 0 var(--line)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-top:4px;color:var(--t3);font-size:10px;font-weight:500;letter-spacing:.1px;transition:color .15s}
.tb.on{color:var(--acc)}

.sheet{position:absolute;left:0;right:0;top:66px;bottom:0;z-index:40;overflow:hidden;background:var(--bg);border-radius:12px 12px 0 0;will-change:transform}
.pages,.page{position:absolute;inset:0}
.body{position:absolute;inset:0;background:var(--bg);will-change:transform}
.pdim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.sbar{position:absolute;left:0;right:0;top:0;height:56px;z-index:30;touch-action:none;cursor:grab}
.grab{position:absolute;left:176.5px;top:0;width:40px;height:20px;cursor:pointer}
.grab::after{content:"";position:absolute;left:2px;top:6px;width:36px;height:5px;border-radius:3px;background:var(--t3);opacity:.55}
.navs{position:absolute;left:0;right:0;top:0;height:56px;z-index:40;pointer-events:none}
.nav{position:absolute;inset:0}
.nav-bg{position:absolute;inset:0;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 .5px 0 var(--line);opacity:0;transition:opacity .2s}
.nav.col .nav-bg{opacity:1}
.nav .hit{pointer-events:auto}
.nb{position:absolute;top:14px;width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--t2)}
.nb.r{right:14px}.nb.r2{right:52px}
.nback{position:absolute;left:4px;top:8px;height:40px;padding:0 10px 0 8px;display:flex;align-items:center;gap:5px;color:var(--acc);font-size:17px;letter-spacing:-.4px}
.nmid{position:absolute;left:96px;right:96px;top:8px;height:40px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
.nmid b{font-weight:600}
.nav.col .nmid{opacity:1;transform:none}
.foot{position:absolute;left:0;right:0;bottom:0;height:104px;z-index:1;padding:16px 16px 0;background:linear-gradient(rgba(0,0,0,0),var(--bg) 16px)}
.edge{position:absolute;left:0;top:56px;bottom:104px;width:18px;z-index:2;touch-action:none;cursor:grab}


.pr{transition:transform .15s ease,opacity .15s}
.pr:active{transform:scale(.975)}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--t2)}
.coin{display:inline-block;flex:none;border-radius:50%;background-size:cover;background-position:center;background-repeat:no-repeat;overflow:hidden}
.coin svg{display:block}
.coin.lg-sol{background-color:#000;background-size:62%}
.ic,.av{display:inline-grid;place-items:center;flex:none;border-radius:50%;overflow:hidden;font-weight:700;line-height:1;color:#fff;letter-spacing:0}
.av{border-radius:28%}
.appic{display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#5B9BFF,#2357E3);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 3px;border-radius:11px;background:var(--fill);font-size:12.5px;font-weight:600;color:var(--t1);letter-spacing:0;flex:none}
.tag .pc{margin-left:1px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px;margin:30px 0 10px}
.sec-h b{font-size:20px;font-weight:700;letter-spacing:.1px}
.sec-h button{font-size:15px;color:var(--acc)}
.group{margin:0 16px;border-radius:16px;background:var(--card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;position:relative}
.group>*+*::before{content:"";position:absolute;left:16px;right:0;top:0;border-top:.5px solid var(--line)}
.group>.row+.row::before{left:68px}
.sk{display:block;background:var(--sk1);border-radius:8px;animation:skp .9s ease-in-out infinite alternate}
@keyframes skp{from{background-color:var(--sk1)}to{background-color:var(--sk2)}}
.chips{display:flex;gap:8px;padding:0 20px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 15px;border-radius:17px;background:var(--card);color:var(--t1);font-size:15px;font-weight:500;white-space:nowrap;transition:background-color .15s,color .15s}
.chip.on{background:var(--t1);color:var(--bg)}
.acts{display:flex;justify-content:space-between;padding:22px 24px 0}
.act{width:66px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;font-weight:500}
.act i{width:52px;height:52px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--acc)}
.empty{margin:0 16px;padding:18px 16px;border-radius:16px;background:var(--card);color:var(--t2);font-size:14.5px}
.btn{display:block;width:100%;height:50px;border-radius:14px;background:var(--acc);color:var(--on-acc);font-size:17px;font-weight:600;text-align:center}

.seg{display:flex;gap:24px;margin:26px 20px 12px;box-shadow:inset 0 -.5px 0 var(--line)}
.seg button{position:relative;display:flex;align-items:center;gap:7px;height:42px;font-size:16px;font-weight:600;color:var(--t3);letter-spacing:-.2px;transition:color .15s}
.seg button.on{color:var(--t1)}
.seg button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:1px;background:var(--acc)}
.cnt{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--acc);color:var(--on-acc);font-size:11px;font-weight:700;letter-spacing:0}
.seg-more{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 32px);height:44px;margin:12px 16px 0;border-radius:14px;background:var(--card);color:var(--acc);font-size:15px;font-weight:600}
.brk,.imp{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:rgba(242,71,79,.15);color:var(--dn);font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;flex:none}
.imp{background:var(--imp-bg);color:var(--imp)}

.nrow{display:block;width:100%;padding:13px 16px 14px;position:relative}
.nm{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--t2);letter-spacing:-.05px;white-space:nowrap}
.nm .ext{display:inline-grid;color:var(--t3)}
.nm .nmt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.nrow .t{margin-top:7px;font-size:15.5px;font-weight:600;line-height:20.5px;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.group.big .nrow .t{font-size:16.5px;line-height:21.5px;-webkit-line-clamp:3}

.odo{display:inline-flex;height:1em;line-height:1em;overflow:hidden;font-variant-numeric:tabular-nums;white-space:pre}
.odo .d{display:block;height:1em;overflow:hidden}
.odo .d>span{display:block;transition:transform .5s var(--ease)}
.odo .d>span>i{display:block;height:1em;font-style:normal}
.odo .c{display:block;height:1em}


.w-acct{position:absolute;left:16px;top:54px;height:44px;display:flex;align-items:center;gap:10px}
.w-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#86D6F7,#3D7EFF 55%,#1F3C8F);flex:none}
.w-nm{display:flex;flex-direction:column;gap:1px;line-height:1.2}
.w-nm b{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:600}
.w-nm b svg{color:var(--t2)}
.w-nm span{font-size:12.5px;color:var(--t2);font-variant-numeric:tabular-nums;letter-spacing:0}
.w-ics{position:absolute;right:10px;top:54px;height:44px;display:flex;align-items:center}
.w-ic{position:relative;width:42px;height:42px;display:grid;place-items:center}
.w-ic .badge{position:absolute;right:10px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--dn);box-shadow:0 0 0 2px var(--bg)}
.w-bal{padding:112px 20px 0}
.w-bal small{display:block;font-size:14px;color:var(--t2);margin-bottom:6px}
.w-bal .v{font-size:40px;font-weight:700;line-height:46px;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.w-bal .c{margin-top:6px;font-size:15px;font-weight:500;letter-spacing:-.1px}
.arow .l,.mrow .l{flex:1;min-width:0}
.arow b,.mrow b{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
.arow .s,.mrow .s{display:block;margin-top:3px;font-size:13.5px;color:var(--t2);font-variant-numeric:tabular-nums;letter-spacing:-.1px}
.arow .r,.mrow .r{text-align:right}
.arow .r b,.mrow .r b{justify-content:flex-end;font-weight:500;font-variant-numeric:tabular-nums}
.arow .r .s.up{color:var(--up)}.arow .r .s.dn{color:var(--dn)}
.nbadge{display:inline-flex;align-items:center;gap:3px;height:19px;padding:0 6px 0 5px;border-radius:10px;background:var(--acc-soft);color:var(--acc);font-size:11.5px;font-weight:600;letter-spacing:0}


.hero{display:block;width:calc(100% - 32px);margin:16px 16px 0;padding:16px 16px 15px;border-radius:18px;background:var(--card)}
.hero .t{margin:10px 0 14px;font-size:21px;font-weight:700;line-height:26px;letter-spacing:-.45px}
.hero .f{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--t2)}
.stk{display:flex}
.stk .av{box-shadow:0 0 0 2px var(--card)}
.stk .av+.av{margin-left:-6px}
.hero .go{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--acc);font-weight:600}
.hero .fcm{display:flex;align-items:center;gap:5px;color:var(--t1);font-weight:600}
.okc{display:grid;place-items:center;flex:none;width:17px;height:17px;border-radius:50%;background:var(--up);color:#fff}
.hero .okc,.fcard .okc{width:15px;height:15px}
.hero .okc svg,.fcard .okc svg{width:9px;height:9px}

.fcs{display:flex;gap:10px;padding:0 16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.fcs::-webkit-scrollbar{display:none}
.fcard{flex:none;width:290px;display:flex;flex-direction:column;padding:14px 15px 13px;border-radius:18px;background:var(--card)}
.fcs.one .fcard{width:100%}
.fcard .t{margin:9px 0 13px;font-size:16px;font-weight:600;line-height:21px;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fcard .f{margin-top:auto;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap}
.fcard .stk{margin-left:auto}


.search{margin:0 16px;height:38px;border-radius:12px;background:var(--fill);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--t3);font-size:16px}
.mrow{display:block;width:100%;padding:12px 16px;position:relative}
.mtop{display:flex;align-items:center;gap:12px}
.mrow .spk{flex:none}
.mrow .r{width:92px}
.mrow .nt{display:flex;align-items:center;gap:6px;margin:9px 0 0 50px;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden}
.mrow .nt span{overflow:hidden;text-overflow:ellipsis}
.mrow .nt svg{flex:none;color:var(--acc)}


.swap{position:relative;padding:0 16px}
.sw-card{height:122px;border-radius:18px;background:var(--card);padding:14px 16px}
.sw-card+.sw-card{margin-top:6px}
.sw-l{font-size:13.5px;color:var(--t2)}
.sw-mid{display:flex;align-items:center;justify-content:space-between;margin:8px 0 7px}
.sw-amt{font-size:32px;font-weight:600;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.sw-tok{display:flex;align-items:center;gap:7px;height:38px;padding:0 11px 0 6px;border-radius:19px;background:var(--card2);font-size:16px;font-weight:600}

function closeTop() { const st = snap(); if (cur.lock || !st.ov.length) return; st.ov.pop(); popRoute(st); }
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.activeElement && document.activeElement.matches("input")) return document.activeElement.blur();
  goBack();
});
function setRange(pg, r) {
  if (!pg || pg.st < 1 || pg.range === r) return;
  pg.range = r;
  $$(".rg", pg.el).forEach(b => b.classList.toggle("on", b.dataset.range === r));
  clearTimeout(pg.rt);
  pg.rt = setTimeout(() => fillToken(pg), INSTANT ? 0 : 220);
}
function setSeg(k) {
  walletSeg = k;
  const p = L.panels.wallet;
  if (!p) return;
  $$("[data-seg]", p.el).forEach(b => b.classList.toggle("on", b.dataset.seg === k));
  $('[data-sec="wseg"]', p.el).innerHTML = walletSegHTML();
}
function setNewsTab(btn) {
  const root = btn.closest(".pg");
  $$("[data-ntab]", root).forEach(b => b.classList.toggle("on", b === btn));
  $$("[data-ntab-body]", root).forEach(d => { d.hidden = d.dataset.ntabBody !== btn.dataset.ntab; });
}
function toggleBox(btn) {
  if (btn.dataset.tog === "fc") return btn.closest(".fc").classList.toggle("open");
  const open = btn.previousElementSibling.classList.toggle("open");
  $("span", btn).textContent = open ? "Show less" : "See more";
}
function vote(btn) {
  const on = !btn.classList.contains("on");
  $$("[data-vote]", btn.parentElement).forEach(b => b.classList.remove("on"));
  btn.classList.toggle("on", on);
}
function stepCar(car, d) {
  const pg = pageOf(car);
  if (!pg) return;
  const N = NEWS[pg.id], kind = car.dataset.car, list = N.rows.filter(r => kind === "x" ? r.x : !r.x), n = list.length;
  const i = ((+car.dataset.i + d) % n + n) % n;
  car.dataset.i = i;
  $("[data-pos]", car).textContent = `${i + 1} / ${n}`;
  $("[data-card]", car).innerHTML = mcard(list[i], kind, N);
}
function setStance(btn) {
  const pg = pageOf(btn), on = !btn.classList.contains("on");
  $$("[data-stance]", btn.parentElement).forEach(b => b.classList.remove("on"));
  btn.classList.toggle("on", on);
  if (pg) pg.stance = on ? btn.dataset.stance : null;
}
function bindChat(pg) {
  const form = $("form", pg.el), input = $("input", form), send = $("button", form);
  pg.stance = null;
  input.addEventListener("input", () => { send.disabled = !input.value.trim(); });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const m = input.value.trim();
    if (!m) return;
    const c = {me: 1, u: "You", t: "now", s: pg.stance, m};
    (CHAT[pg.id] = CHAT[pg.id] || []).push(c);
    $("[data-list]", pg.el).insertAdjacentHTML("beforeend", msgHTML(c, true));
    input.value = ""; send.disabled = true;
    pg.sc.scrollTop = pg.sc.scrollHeight;
    for (const d of $$(`[data-disc="${pg.id}"]`, cv)) d.innerHTML = discHTML(pg.id);
  });
  requestAnimationFrame(() => { pg.sc.scrollTop = pg.sc.scrollHeight; });
}
function flipSwap(wrap) {
  const id = wrap.dataset.swap, c = SWAPS[id];
  SWAPS[id] = {pay: c.get, get: c.pay, amt: c.amt * TOKENS[c.pay].px / TOKENS[c.get].px};
  wrap.innerHTML = swapInner(SWAPS[id]);
}

function drag(el, axis, h) {
  el.addEventListener("pointerdown", e => {
    if (e.button > 0 || e.target.closest("button:not(.grab)")) return;
    const x0 = e.clientX, y0 = e.clientY, pts = [];
    let on = false, dead = false;
    const move = ev => {
      const dx = (ev.clientX - x0) / K, dy = (ev.clientY - y0) / K;
      if (!on && !dead) {
        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        const main = axis === "x" ? dx : dy, other = axis === "x" ? dy : dx;
        if (Math.abs(other) > Math.abs(main) || main < 0 && !h.both) { dead = true; return; }
        on = true; h.start && h.start();
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
      }
      if (!on) return;
      pts.push([ev.timeStamp, axis === "x" ? dx : dy]); if (pts.length > 5) pts.shift();
      h.move(axis === "x" ? dx : dy);
      ev.preventDefault();
    };
    const up = ev => {
      removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
      if (!on) return;
      blockClick = Date.now() + 80;
      const a = pts[0], b = pts[pts.length - 1], v = a && b && b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0;
      h.end(axis === "x" ? (ev.clientX - x0) / K : (ev.clientY - y0) / K, v);
    };
    addEventListener("pointermove", move, {passive: false}); addEventListener("pointerup", up); addEventListener("pointercancel", up);
  });
}
function bindSheetDrag(o) {
  drag($(".sbar", o.el), "y", {
    both: true,
    move: dy => setY(o, dy > 0 ? dy / SH : 0),
    end: async (dy, v) => {
      const p = Math.max(0, dy / SH);
      if (p > .25 || v > .5) {
        await tween(Math.max(120, Math.min(320, (1 - p) * SH / Math.max(v, 1.5))), q => setY(o, p + (1 - p) * q));
        o.el.remove(); presentBG(0);
        cur.ov = cur.ov.filter(x => x !== o); refreshInert();
        popRoute(snap());
      } else await tween(220, q => setY(o, p * (1 - q)));
    },
  });
}
function bindEdgeSwipe(o, pg, edge) {
  drag(edge, "x", {
    move: dx => { const low = o.pages[o.pages.indexOf(pg) - 1]; setPush(pg, low, 1 - Math.max(0, dx) / 393); },
    end: async (dx, v) => {
      const low = o.pages[o.pages.indexOf(pg) - 1], p = Math.max(0, dx) / 393;
      if (p > .35 || v > .35) {
        await tween(Math.max(120, Math.min(300, (1 - p) * 393 / Math.max(v, 1.2))), q => setPush(pg, low, (1 - p) * (1 - q)));
        pg.el.remove(); pg.nav.remove();
        o.pages = o.pages.filter(x => x !== pg); if (low) { setPush(low, null, 1); resetLow(low); }
        refreshInert();
        popRoute(snap());
      } else await tween(220, q => setPush(pg, low, 1 - p + p * q));
    },
  });
}
function bindLockDrag(el) {
  drag(el, "y", {
    both: true,
    move: dy => { el.style.transform = `translate3d(0,${(dy < 0 ? dy : dy * .2).toFixed(2)}px,0)`; },
    end: async (dy, v) => {
      if (dy < -110 || v < -.45) return unlock();
      await tween(220, q => { el.style.transform = `translate3d(0,${((dy < 0 ? dy : dy * .2) * (1 - q)).toFixed(2)}px,0)`; });
    },
  });
}
function bindCars(pg) {
  for (const car of $$("[data-car]", pg.el)) {
    const card = $("[data-card]", car);
    drag(card, "x", {
      both: true,
      move: dx => { card.style.transform = `translate3d(${(dx * .6).toFixed(1)}px,0,0)`; },
      end: dx => { card.style.transform = ""; if (Math.abs(dx) > 40) stepCar(car, dx < 0 ? 1 : -1); },
    });
  }
}
function bindHScroll(root) {
  for (const el of $$(".hs", root)) {
    if (el.dataset.b) continue;
    el.dataset.b = 1;
    el.addEventListener("pointerdown", e => {
      if (e.pointerType !== "mouse") return;
      const x0 = e.clientX, s0 = el.scrollLeft;
      let moved = false;
      const mv = ev => { const dx = (ev.clientX - x0) / K; if (Math.abs(dx) > 4) moved = true; el.scrollLeft = s0 - dx; };
      const up = () => { removeEventListener("pointermove", mv); removeEventListener("pointerup", up); if (moved) blockClick = Date.now() + 80; };
      addEventListener("pointermove", mv); addEventListener("pointerup", up);
    });
  }
}


let tickN = 0;
function tick() {
  tickN++;
  for (const o of cur.ov) if (o.pages) for (const pg of o.pages) if (pg.kind === "token" && pg.st > 1 && pg.range === "LIVE" && TOKENS[pg.id].live) {
    const el = $('[data-odo="px"]', pg.el);
    if (el) odoSet(el, TOKENS[pg.id].live[tickN % 2]);
  }
}
const clockText = () => { if (FLAGS.clock) return FLAGS.clock; const d = new Date(); return `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")}`; };
function tickClock() {
  $(".st-clock", cv).textContent = clockText();
  if (!L.lock) return;
  $("[data-ltime]", L.lock).textContent = clockText();
  $("[data-ldate]", L.lock).textContent = new Date().toLocaleDateString("en-US", {weekday: "long", month: "long", day: "numeric"});
}


const THEME_KEY = "walletDemo.theme";
function setTheme(t, save = true) {
  document.documentElement.dataset.theme = t;
  $$(".m-seg button").forEach(b => b.classList.toggle("on", b.dataset.themeSet === t));
  $$("[data-dm-theme]").forEach(b => b.classList.toggle("on", b.dataset.dmTheme === t));
  if (save) try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
}
function bindDemoMenu() {
  const m = mk("div", "dmenu");
  m.hidden = true;
  m.innerHTML = `<div class="dm-card"><b>Demo</b><div class="dm-seg"><button data-dm-theme="dark">Dark</button><button data-dm-theme="light">Light</button></div><button class="dm-btn" data-dm-lock>Show lock screen notification</button></div>`;
  cv.appendChild(m);
  setTheme(document.documentElement.dataset.theme, false);
  m.addEventListener("click", e => {
    const th = e.target.closest("[data-dm-theme]");
    if (th) return setTheme(th.dataset.dmTheme);
    if (e.target.closest("[data-dm-lock]")) { m.hidden = true; return relock(); }
    if (!e.target.closest(".dm-card")) m.hidden = true;
  });
  screen.addEventListener("click", e => {
    if (Date.now() < blockClick || cur.lock || cur.ov.length || !m.hidden) return;
    if (e.target.closest(".w-acct")) m.hidden = false;
    else if (e.target.closest('.w-ic[aria-label="Notifications"]')) relock();
  });
}
function boot() {
  let th = FLAGS.theme;
  if (!th) try { th = localStorage.getItem(THEME_KEY); } catch (_) {}
  setTheme(th === "light" ? "light" : "dark", false);
  $$(".m-seg button").forEach(b => b.addEventListener("click", () => setTheme(b.dataset.themeSet)));
  $("#m-lock").addEventListener("click", relock);
  cv.innerHTML = `<section class="layer" id="tabs"><nav class="tbar">${TABS.map(t => `<button class="tb" data-go="tab:${t}">${I[TAB_UI[t][0]]}<span>${TAB_UI[t][1]}</span></button>`).join("")}</nav><div class="dim"></div></section>
    <div class="status"><span class="st-clock"></span><span class="st-ic">${I.signal}${I.wifi}${I.battery}</span></div><div class="island"></div><div class="homeind"></div>`;
  L.tabs = $("#tabs");
  L.tbar = $(".tbar", cv);
  L.dim = $(".dim", cv);
  L.status = $(".status", cv);
  const fit = () => {
    K = screen.clientWidth / 393;
    if (PHONE) { CH = Math.round(screen.clientHeight / K); SH = CH - 66; cv.style.height = CH + "px"; }
    cv.style.transform = `scale(${K})`;
  };
  if (PHONE) bindDemoMenu();
  new ResizeObserver(fit).observe(screen);
  addEventListener("resize", fit);
  fit();
  tickClock(); setInterval(tickClock, 10000);
  const t = parse(canon());
  H.list = [ser(t)]; H.i = 0;
  if (location.hash.slice(1) !== ser(t)) location.replace("#" + ser(t));
  enqueue(() => sync(t, false)).then(() => {
    const top = cur.ov.length ? cur.ov[cur.ov.length - 1] : null;
    const sc = top && top.pages ? top.pages[top.pages.length - 1].sc : L.panels[cur.tab].sc;
    if (FLAGS.scroll) sc.scrollTop = FLAGS.scroll === "max" ? 1e6 : +FLAGS.scroll;
    sc.dispatchEvent(new Event("scroll"));
  });
  if (!INSTANT) setInterval(tick, 3500);
  document.addEventListener("touchstart", () => {}, {passive: true});
  window.__mock = {state: snap, idle: () => queue, H, cur, visited, setTheme, sync: h => enqueue(() => sync(parse(h), false))};
}
boot();
